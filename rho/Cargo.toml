[package]
name = "rho"
description.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap = { version = "4.5", features = ["derive"] }
rho-core = { path = "../rho-core" }
rho-protocol = { path = "../rho-protocol" }
rho-ext = { path = "../rho-ext" }
rho-memory = { path = "../rho-memory" }
rho-tools = { path = "../rho-tools" }
rho-ai = { path = "../rho-ai" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio.workspace = true
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
regex = "1"
rho-protocol = { path = "../rho-protocol", features = ["schema"] }
rho-test-helpers = { path = "../rho-test-helpers" }
