[package]
name = "rho-highlight"
description.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true
categories.workspace = true

[lints]
workspace = true

# ── Build dependency (C toolchain) ───────────────────────────────────────────
# tree-sitter grammars compile embedded C sources at build time via the
# `cc` crate.  Ensure a C compiler is available:
#   - Windows: Visual Studio Build Tools (MSVC) or LLVM/clang
#   - macOS:   Xcode Command Line Tools (`xcode-select --install`)
#   - Linux:   gcc or clang (`apt install build-essential` / equivalent)

[features]
# `rust` is the default grammar and the only one available right now.
# Additional grammars are opt-in features for the future.
default = ["rust"]

# Tree-sitter Rust grammar.
rust = ["dep:tree-sitter-rust"]

# Reserved opt-in grammar features.
# powershell = ["dep:tree-sitter-powershell"]
# toml      = ["dep:tree-sitter-toml"]
# json      = ["dep:tree-sitter-json"]
# markdown  = ["dep:tree-sitter-md"]

[dependencies]
rho-core = { path = "../rho-core" }
thiserror.workspace = true
tree-sitter.workspace = true
tree-sitter-rust = { version = "0.24", optional = true }

[dev-dependencies]
rho-test-helpers = { path = "../rho-test-helpers" }
