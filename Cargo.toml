[workspace]
members = [
    "rho",
    "rho-ai",
    "rho-core",
    "rho-ext",
    "rho-highlight",
    "rho-memory",
    "rho-protocol",
    "rho-tools",
    "rho-test-helpers",
    "xtask",
    "rho-schema-gen",
]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }
toml = { version = "1.0.7+spec-1.1.0", features = ["parse"] }
tracing = "0.1"
tree-sitter = "0.27"
uuid = { version = "1", features = ["v4", "serde"] }
which = "8"

[workspace.package]
version = "0.92.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/crustyrustacean/rho-coding-agent"
description = "A coding agent written in Rust"
readme = "README.md"
keywords = ["coding-agent", "ai", "cli"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = 'abort'
strip = true

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
multiple_crate_versions = "allow"
unnecessary_literal_bound = "allow"