# cargo-release configuration
# https://github.com/crate-ci/cargo-release/blob/master/docs/reference.md

# Do not push or publish automatically — allow review before pushing.
push = false
publish = false

# Sign the release commit and tag.
sign-commit = true
sign-tag = true

# Update the changelog before the release commit.
pre-release-hook = [
    "git", "cliff", "-o", "CHANGELOG.md", "--tag", "{{version}}"
]

# Include the changelog in the release commit.
include = [
    "CHANGELOG.md",
]

# Do not dev-version after release (prevent an unexpected 0.2.0-dev).
dev-version = false

# Tag format.
tag-name = "v{{version}}"
tag-message = "Release {{version}}"
