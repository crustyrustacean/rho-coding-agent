[package]
name = "rho-tools"
description.workspace = true
edition.workspace = true
keywords.workspace = true
license.workspace = true
publish.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true
categories.workspace = true

[lints]
workspace = true

[dev-dependencies]
dunce = "1"
rho-test-helpers = { path = "../rho-test-helpers" }
tempfile = "3"

[dependencies]
rho-core = { path = "../rho-core" }
rho-highlight = { path = "../rho-highlight" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0.102"
ignore = "0.4"
serde_json = "1.0.149"
tree-sitter = "0.26"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "process", "io-util", "fs", "time"] }
which = "7"
