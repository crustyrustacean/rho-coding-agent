<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ site.name }}{% endblock %}</title>
  {% if page?.description %}
  <meta name="description" content="{{ page.description }}">
  {% elif section?.description %}
  <meta name="description" content="{{ section.description }}">
  {% else %}
  <meta name="description" content="{% block description %}{{ site.description }}{% endblock %}">
  {% endif %}
  <meta name="robots" content="index, follow">
  <meta name="author" content="{{ site.author }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{% block og_title %}{{ site.name }}{% endblock %}">
  <meta property="og:description" content="{% block og_description %}{{ site.description }}{% endblock %}">
  <meta property="og:url" content="{{ site.base_url }}{{ page?.path | default(value='/') }}">
  <meta property="og:image" content="{{ site.base_url }}/static/favicon.png">
  <meta property="og:site_name" content="{{ site.name }}">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{% block twitter_title %}{{ site.name }}{% endblock %}">
  <meta name="twitter:description" content="{% block twitter_description %}{{ site.description }}{% endblock %}">
  <meta name="twitter:image" content="{{ site.base_url }}/static/favicon.png">

  <link rel="icon" type="image/png" href="/static/favicon.png">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/_highlight-dark.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="/css/_highlight-light.css" media="(prefers-color-scheme: light)">
</head>
<body>
  <div class="page">
    {% include "partials/header.html" %}
    <main>
      {% block content %}{% endblock %}
    </main>
    {% include "partials/footer.html" %}
  </div>
  <!-- No WASM island here: taxus's SearchBox needs a Trunk-built client and
       this site doesn't ship one. `static/scripts.js` covers the rest. -->
  <script src="/static/scripts.js"></script>
</body>
</html>
