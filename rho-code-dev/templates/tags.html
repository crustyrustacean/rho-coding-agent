{% extends "base.html" %}

{% block title %}Tags - {{ site.name }}{% endblock %}

{% block content %}
<section>
    <h1>Tags</h1>
    {% if extra.taxonomy.terms %}
    <ul class="taxonomy-list">
        {% for term in extra.taxonomy.terms %}
        <li>
            <a href="{{ term.path }}">
                {{ term.name }} ({{ term.page_count }})
            </a>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No tags yet.</p>
    {% endif %}
</section>
{% endblock %}
